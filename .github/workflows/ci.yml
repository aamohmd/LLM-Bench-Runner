name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q src scripts benchmark_scoring
      - run: python -m pytest --junitxml=junit.xml --durations=10
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: junit.xml
          if-no-files-found: ignore

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify native installation and launcher
        run: |
          bash scripts/setup.sh
          bash scripts/run.sh --help
      - name: Verify independent archive
        run: |
          bash scripts/build_bundle.sh
          unzip -t dist/universal-benchmark-runner.zip
          bundle_dir="$(mktemp -d)"
          unzip -q dist/universal-benchmark-runner.zip -d "$bundle_dir"
          runner_python="$PWD/.venv/bin/python"
          cd "$bundle_dir/universal-benchmark-runner"
          "$runner_python" scripts/run_remote_benchmark.py --help
      - name: Validate container configuration and image
        run: |
          docker compose config --quiet
          docker build -t llm-bench-runner-ci .
          docker run --rm llm-bench-runner-ci --help
