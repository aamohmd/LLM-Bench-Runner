name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src scripts benchmark_scoring
      - run: python scripts/run_remote_benchmark.py --help
      - run: bash scripts/build_bundle.sh && unzip -t dist/universal-benchmark-runner.zip
      - run: docker compose config --quiet
      - run: docker build -t llm-bench-runner-ci .
      - run: docker run --rm llm-bench-runner-ci --help
